# Builds the Phylax container image, TESTS THE IMAGE ITSELF, and only then publishes it to the GitHub Container Registry (ghcr.io).
# Run it by pushing a version tag:   git tag v0.1.0 && git push origin v0.1.0     (or from the Actions tab: "Run workflow").
# The image holds no secrets: keys are passed in when the container starts.
name: Publish image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the image (not published yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: phylax:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Start the image exactly as Azure will, and run the smoke test against it. If this fails, nothing is published.
      - name: Smoke test the image
        run: |
          KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          echo "::add-mask::$KEY"
          docker run -d --name phylax -p 8080:8080 -e "SERVICE_API_KEYS=ci:scan+read:$KEY" phylax:candidate
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8080/healthz >/dev/null && break
            sleep 1
          done
          PHYLAX_API_KEY="$KEY" python3 deploy/smoke.py --url http://127.0.0.1:8080
          docker logs phylax | tail -n 20
          docker stop phylax

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
